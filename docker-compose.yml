services:
  server:
    build: .
    container_name: message-api-server
    environment:
      PORT: 8081
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/message_api
      REDIS_URL: redis:6379
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    container_name: message-api-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d message_api"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8.8.0-trixie
    container_name: message-api-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
